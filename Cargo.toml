[package]
name = "cu-wiki-mcp"
version = "1.0.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
scraper = "0.20"
ego-tree = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
# x402 / CDP facilitator auth only: Ed25519 (EdDSA) + P-256 (ES256) JWT
# signers, mirroring the Python staging implementation's pure-stdlib
# signers. No other new dependencies.
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
opt-level = 3
